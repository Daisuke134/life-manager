[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manager"
version = "0.1.0"
description = "Provenance-aware population reconstruction component for Manager"
requires-python = ">=3.12"
dependencies = ["ipfn==1.4.4", "numpy==2.4.4", "pandas==2.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

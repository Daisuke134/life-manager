# ANICCA iOS v7 onboarding + soft-paywall E2E
# Flow: welcome → goal → pain points → frequency → nudge time → processing
#       → plan reveal → comparison → rating prompt → notifications → paywall → feed

appId: ai.anicca.app.ios
name: ANICCA v7 Onboarding and Soft Paywall
tags:
  - onboarding
  - paywall
  - v7

---
# Preconditions: freshly erased dedicated simulator with the Staging app installed.
# clearState reinstalls iOS apps; this avoids a second WebRTC app-bundle copy.
- startRecording:
    path: "anicca-onboarding-v7"
- launchApp:
    arguments:
      UITESTING: "true"

# === Step 1: Welcome ===
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome-cta"
    timeout: 60000
- takeScreenshot: "v7-01-welcome"
- tapOn:
    id: "onboarding-welcome-cta"

# === Step 2: Goal ===
- extendedWaitUntil:
    visible:
      text: "何を変えたいですか？"
    timeout: 15000
- takeScreenshot: "v7-02-goal"
- tapOn:
    text: "悪い習慣を断ち切る"

# === Step 3: Pain points ===
- extendedWaitUntil:
    visible:
      id: "onboarding-struggle-negative_thoughts"
    timeout: 15000
- takeScreenshot: "v7-03-pain-points"
- tapOn:
    id: "onboarding-struggle-putting_off"
- tapOn:
    id: "onboarding-struggles-next"

# === Step 4: Frequency ===
- extendedWaitUntil:
    visible:
      id: "onboarding-depth-daily"
    timeout: 15000
- takeScreenshot: "v7-04-frequency"
- tapOn:
    id: "onboarding-depth-daily"

# === Step 5: Nudge times ===
- extendedWaitUntil:
    visible:
      text: "いつ言葉を届けましょうか？"
    timeout: 15000
- takeScreenshot: "v7-05-nudge-times"
- tapOn:
    text: "朝 (9時)"
- tapOn:
    text: "続ける"

# === Step 6: Processing ===
- takeScreenshot: "v7-06-processing"

# === Step 7: Personalized plan reveal ===
- extendedWaitUntil:
    visible:
      id: "onboarding-insight-cta"
    timeout: 30000
- takeScreenshot: "v7-07-plan-reveal"
- tapOn:
    id: "onboarding-insight-cta"

# === Step 8: Comparison ===
- extendedWaitUntil:
    visible:
      text: "96%"
    timeout: 15000
- takeScreenshot: "v7-08-comparison"
- tapOn:
    text: "続ける"

# === Step 9: Rating prompt (Maestro advances without opening StoreKit review UI) ===
- extendedWaitUntil:
    visible:
      text: "アニッチャを評価"
    timeout: 15000
- takeScreenshot: "v7-09-rating-prompt"
- tapOn:
    text: "アニッチャを評価"

# === Step 10: Notifications ===
- extendedWaitUntil:
    visible:
      id: "onboarding-notifications-allow"
    timeout: 15000
- takeScreenshot: "v7-10-notifications"
- tapOn:
    id: "onboarding-notifications-allow"
- tapOn:
    text: "許可しない|Don't Allow|Don’t Allow"
    optional: true

# === Step 11: Soft paywall ===
- extendedWaitUntil:
    visible:
      id: "paywall-primer-cta"
    timeout: 30000
- takeScreenshot: "v7-11-paywall-primer"
- assertVisible:
    id: "paywall-close-button"
- tapOn:
    id: "paywall-primer-cta"
- extendedWaitUntil:
    visible:
      text: "あなたが一番つらいとき、\nそっと届く言葉"
    timeout: 15000
- takeScreenshot: "v7-12-plan-selection"
- assertVisible:
    id: "paywall-close-button"
- tapOn:
    id: "paywall-close-button"

# === Verify: main feed ===
- extendedWaitUntil:
    visible:
      id: "feed-scroll"
    timeout: 15000
- takeScreenshot: "v7-13-main-feed"
- stopRecording

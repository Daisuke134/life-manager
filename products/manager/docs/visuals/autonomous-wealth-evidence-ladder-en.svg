<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="865" viewBox="0 0 1500 865" role="img" aria-labelledby="ttl desc"><title id="ttl">Autonomous agents: seven levels of evidence from task success to real wealth</title><desc id="desc">A research diagram distinguishing successful tool calls, fictional business profit, historical task value, real external actions, settled net profit, credible causal incrementality and independently verified beneficiary wealth.</desc>

name: Manager Phase04 Public Aggregate Mobility Benchmark
on:
  push:
    branches: [research/manager-product-r006-20261020]
    paths:
      - 'products/manager/manager_core/phase04_bike_sharing.py'
      - 'products/manager/tests/test_phase04_bike_sharing.py'
      - 'products/manager/scripts/phase04_bike_sharing.py'
      - '.github/workflows/manager-phase04-public-aggregate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-aggregate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused safety and methodological tests
        run: python -m unittest tests/test_phase04_bike_sharing.py -v
      - name: Pinned public real aggregate holdout (NO SocSci210 participants)
        run: python scripts/phase04_bike_sharing.py --output output/phase04-public-aggregate
      - name: Cross-check against official UCI archive when reachable
        run: |
          python - <<'PY'
          import io, json, zipfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          from manager_core.phase04_bike_sharing import git_blob_sha, SOURCE_GIT_BLOB_SHA1
          url='https://archive.ics.uci.edu/static/public/275/bike+sharing+dataset.zip'
          outcome={'official_archive_url':url,'source':'UCI original','status':'NOT_RETRIEVED'}
          try:
              with urlopen(Request(url,headers={'User-Agent':'Manager-Research-Aggregate-Only/1.0'}), timeout=20) as resp:
                  data=resp.read(400000)
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  names=[n for n in archive.namelist() if n.endswith('/day.csv') or n=='day.csv']
                  if len(names)!=1:
                      raise ValueError('official zip does not have unique day.csv')
                  orig=archive.read(names[0])
              sha=git_blob_sha(orig)
              outcome['status']='BYTE_IDENTICAL' if sha==SOURCE_GIT_BLOB_SHA1 else 'MISMATCH'
              outcome['official_day_csv_git_blob_sha1']=sha
              outcome['official_file_bytes']=len(orig)
              if outcome['status']=='MISMATCH':
                  raise ValueError('mirror source differs from official archive')
          except (OSError, TimeoutError, zipfile.BadZipFile) as exc:
              outcome['status']='OFFICIAL_ARCHIVE_UNAVAILABLE'
              outcome['failure_class']=type(exc).__name__
          Path('output/phase04-public-aggregate/official_archive_crosscheck.json').write_text(json.dumps(outcome,indent=2)+'\n')
          print(json.dumps(outcome,sort_keys=True))
          PY
      - name: Enforce provenance, missing causal proof, and no raw source rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('output/phase04-public-aggregate')
          files = list(root.glob('*'))
          assert {x.name for x in files} == {'public_bikeshare_aggregate.json', 'official_archive_crosscheck.json'}
          report = json.loads((root/'public_bikeshare_aggregate.json').read_text())
          cross = json.loads((root/'official_archive_crosscheck.json').read_text())
          assert cross['status'] == 'BYTE_IDENTICAL'
          assert report['source_snapshot_verified'] is True
          assert (report['train_days'], report['heldout_days']) == (365,366)
          assert report['split']['train_test_date_disjoint']
          assert {x['name'] for x in report['heldout_conditions']} == {'winter_2012','summer_2012'}
          assert report['privacy']['participant_records'] == 0
          assert report['privacy']['raw_rows_published'] is False
          assert report['socsci210_human_benchmark'] == 'NOT_PERFORMED_RIGHTS_HOLD'
          assert report['causal_effect_estimated'] is False
          assert report['manager_benefit_proven'] is False
          assert not list(root.glob('*.csv'))
          print('PASS: source verified, 365/366 train/test, no personal records, no causal claim')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-phase04-real-public-aggregate-only
          path: products/manager/output/phase04-public-aggregate/
          if-no-files-found: warn
          retention-days: 14

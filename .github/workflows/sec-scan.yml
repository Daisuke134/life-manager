name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-contract:
    name: Agent instruction contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical agent instructions and cleanup contract
        run: bash scripts/verify-agent-contract.sh "$GITHUB_WORKSPACE"

  loop-control:
    name: Loop control contracts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install exact loop contract test dependency
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0 pytest==9.0.3 websocket-client==1.9.0
      - name: Verify public Mac bootstrap and Coconala dependency selection
        run: |
          python3 -m unittest scripts.test_mac_bootstrap scripts.test_job_hunter_macos
          python3 -m unittest runtime.host.tests.test_local_profile runtime.loop.tests.test_local_fleet runtime.loop.tests.test_local_install
          python3 -m pytest -q scripts/test_macos_runtime.py skills/earn/gig/tests/test_coconala_installer_runtime.py
      - name: Verify Lancers local identity and caller contracts
        run: >-
          python3 -m pytest -q
          skills/earn/lancers/tests/test_local_identity.py
          skills/earn/lancers/tests/test_pre_effect_hint_reconcile.py
          skills/earn/lancers/tests/test_application_pre_effect_hint.py
          skills/_shared/marketplace-core/tests/test_reply_kernel.py
          skills/earn/lancers/tests/test_lancers_onboarding.py
          skills/earn/lancers/tests/test_application_prompt_handoff.py
          skills/earn/lancers/tests/test_discovery_reads_through_browser.py
          skills/earn/lancers/tests/test_owner_browser_attach_busy_exit_75.py
          skills/earn/lancers/tests/test_paid_owner_reconcile.py
          skills/earn/lancers/tests/test_reply_adapter.py
          skills/earn/lancers/tests/test_storefront_owner_pre_effect.py
          skills/earn/lancers/tests/test_storefront_effect_reconcile.py
          skills/earn/lancers/tests/test_create_package.py
          skills/earn/lancers/tests/test_install_local.py
          skills/earn/lancers/tests/test_profile_readback.py
          skills/earn/lancers/tests/test_storefront_offer_reads_catalog.py
          apps/lancers-revenue/tests/test_application_attribution.py
          apps/lancers-revenue/tests/test_persona_facts_in_planner.py
          apps/lancers-revenue/tests/test_form_failures_name_themselves.py
          apps/lancers-revenue/tests/test_telegram_report.py
      - name: Verify CrowdWorks account and private profile contracts
        run: >-
          python3 -m pytest -q
          skills/earn/crowdworks/tests/test_account_identity.py
          skills/earn/crowdworks/tests/test_profile_avatar.py
          skills/earn/crowdworks/tests/test_profile_private_identity.py
      - name: Verify browser lease ownership and tab preservation
        run: >-
          python3 -m pytest -q
          skills/browser/tests/test_guard_legacy_lease.py
          skills/browser/scripts/test_browser_guard_empty_lease.py
      - name: Verify registry, releases, apply fencing, and clean install
        run: python3 -m unittest discover -s runtime/loop/tests -p 'test_*.py' --durations 15
      - name: Verify bounded storage, real syscall failures, and recurrence
        run: >-
          python3 -m pytest -q
          runtime/loop/tests/test_lm_loop_run_bounds.py
          runtime/loop/tests/test_storage_failure.py
          runtime/loop/tests/test_release_source_reclaim.py
          runtime/loop/tests/test_release_gc_fail_closed.py
          runtime/host/tests/test_disk_admission.py
          runtime/host/tests/test_storage_policy.py
          runtime/host/tests/test_bounded_output.py
          runtime/host/tests/test_storage_recurrence.py
          runtime/agent-runner/tests
          skills/self/disk-cleanup/tests/test_host_inventory.py
          skills/self/disk-cleanup/tests/test_disk_cleanup.py
          skills/self/disk-cleanup/tests/test_disk_watchdog_dispatcher.py
      - name: Verify storage recovery waits and replay fencing
        run: >-
          node --test
          runtime/loop/__tests__/storage-recovery.test.mjs
          runtime/loop/__tests__/recovery-intent.test.mjs
          runtime/loop/__tests__/recovery-intent-record.test.mjs
          runtime/loop/__tests__/recovery-apply-plan.test.mjs
          runtime/loop/__tests__/recovery-executor.test.mjs
          runtime/loop/__tests__/recovery-supervisor.test.mjs

  writer-eval:
    name: Writer EDD receipt grader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Run W-01 code grader and regression tests
        working-directory: apps/life-manager
        run: npm run test:writer-eval

  web-attribution:
    name: Web CTA attribution contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Run Writer CTA first-touch, Web forwarding, and report tests
        working-directory: apps/life-manager
        run: >-
          node --test
          lib/web-attribution.test.js
          lib/web-auth.test.js
          lib/web-funnel-events.test.js
          lib/web-funnel-report.test.js
          lib/web-page.test.js
          scripts/lm-web-funnel-report.test.js
          lib/product-onboarding.test.js
          scripts/product-onboarding-plan.test.js

  openclaw-foundation:
    name: OpenClaw offline foundations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify portable request and guarded RPC boundaries
        run: node --test runtime/openclaw/tests/*.test.mjs test/openclaw-portability.test.mjs
      - name: Verify private dispatch persistence and single sender
        run: python3 -m unittest discover -s runtime/openclaw/tests -p 'test_*.py'

  context-drift:
    name: Startup context drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify README, fundraising kit, and active form context
        run: node --test test/startup-context.test.mjs test/startup-context-export.test.mjs skills/apply-to-funder/__tests__/context.test.mjs
      - name: Verify canonical public links and product context digest
        # Public deployment readback follows integration; PRs validate source above.
        if: github.event_name != 'pull_request'
        run: node scripts/startup-context/audit.mjs

  monk-factory-web:
    name: Monk Factory Web contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Ensure native video frame tools are available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ] &&
               grep -Eq '^[[:space:]]*https?://archive[.]ubuntu[.]com/ubuntu/?([[:space:]]|$)' /etc/apt/apt-mirrors.txt; then
              sudo sed -i -E '/^[[:space:]]*https?:\/\/azure[.]archive[.]ubuntu[.]com\/ubuntu\/?([[:space:]]|$)/d' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify local workspace and bounded Factory tools without provider effects
        run: node --test --test-concurrency=1 skills/earn/marketing-engine/factory-web/*.test.mjs skills/earn/marketing-engine/factory-mcp.test.mjs

  oss-boundary:
    name: OSS self-contained boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical checkout has no external source dependency
        run: node scripts/verify-oss-self-contained.mjs

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -e
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks dir (= current merge result)
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact -v

      - name: gitleaks git (= full history with adjudicated fingerprint baseline)
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact -v --log-opts=--all

  trufflehog:
    name: TruffleHog (verified git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cover both the PR head and merge result, including criss-cross history.
      - name: Select covering PR history
        id: trufflehog-range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$(git merge-base --all "$BASE_SHA" "$HEAD_SHA")"
          if [[ "$base" == *$'\n'* ]]; then
            base=""
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      # The action scans Git in both cases; select the covering range once.
      - name: TruffleHog all refs
        if: github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: TruffleHog merge result range
        if: github.event_name != 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before || steps.trufflehog-range.outputs.base }}
          head: HEAD
          extra_args: --only-verified

  shape-grep:
    name: PII shapes (redacted exact-fingerprint gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Block accidental PII patterns
        run: python3 scripts/security/pii_shape_scan.py --allowlist .pii-shape-allowlist .

  python-lint:
    name: Python syntax + unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install exact test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: ast.parse every .py
        run: |
          set -e
          python3 - <<'PY'
          import ast
          from pathlib import Path

          excluded = {".git", "node_modules", ".venv", "venv"}
          failures = []
          for path in Path(".").rglob("*.py"):
              if excluded.intersection(path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("\n".join(failures))
          PY
          echo "✅ syntax clean"

      - name: run declared pure-stdlib security tests
        run: |
          set -euo pipefail
          while IFS= read -r t; do
            [[ -z "$t" || "$t" == \#* ]] && continue
            test -f "$t"
            echo "→ $t"
            python3 "$t"
          done < .github/python-security-tests.txt
          echo "✅ declared security tests passed"

  shell-lint:
    name: Shell syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every .sh
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -exec bash -n {} \;
          echo "✅ all .sh files parse"

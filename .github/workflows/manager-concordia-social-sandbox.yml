name: Manager Concordia Social Agents Offline Sandbox (MOCK, not human validation)
on:
  push:
    branches: [research/manager-product-r006-20261020]
    paths: ['.github/workflows/manager-concordia-social-sandbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  social-agent-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout immutable official Concordia source
        run: |
          git init /tmp/concordia-social-upstream
          git -C /tmp/concordia-social-upstream remote add origin https://github.com/google-deepmind/concordia.git
          git -C /tmp/concordia-social-upstream fetch --depth 1 origin 7128586aa8c1073bfa09dcb3781cea21e1a49229
          git -C /tmp/concordia-social-upstream checkout --detach FETCH_HEAD
          test "$(git -C /tmp/concordia-social-upstream rev-parse HEAD)" = 7128586aa8c1073bfa09dcb3781cea21e1a49229
      - name: Install bounded research-only dependencies (no model API key)
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2" "scipy==1.15.3" /tmp/concordia-social-upstream
      - name: Run actual memory/reflection/action agent simulation on artificial personas
        run: |
          mkdir -p "$GITHUB_WORKSPACE/products/manager/output/concordia-social/simulation"
          cd /tmp/concordia-social-upstream
          python -m examples.concordia_island.run \
            --personas_date=brecksville_ohio \
            --agents=4 --ticks=4 --agent_prefab=esa --engine_type=sequential \
            --event_config=job_loss --layoff_fraction=0.5 \
            --use_mock=True --poll=False \
            --output_dir="$GITHUB_WORKSPACE/products/manager/output/concordia-social/simulation"
      - name: Independently label lack of human validation and test output
        env:
          OUT: ${{ github.workspace }}/products/manager/output/concordia-social
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          sim = root/'simulation'
          expected = ('simulation_state.json','simulation_structured.json',
                      'simulation_log.html','entity_memories.json')
          present = {p.name for p in sim.iterdir() if p.is_file() and p.stat().st_size>0}
          missing = sorted(set(expected)-present)
          assert not missing, 'no observed Concordia agent log files: '+str(missing)
          real = root/'real_world_validation'
          real.mkdir(parents=True, exist_ok=True)
          result = {
             'schema':'manager.concordia.real-upstream-social-mock.v1',
             'engine':'google-deepmind/concordia',
             'source_revision':'7128586aa8c1073bfa09dcb3781cea21e1a49229',
             'license':'Apache-2.0',
             'engine_executed':True,
             'runtime_mode':'DETERMINISTIC_OFFLINE_MOCK',
             'scenario':'Concordia Island artificial job-loss agents',
             'artificial_agents':4, 'ticks_requested':4,
             'memory_log_exists':True,
             'artificial_personas_only':True,
             'real_world_validation_n':0,
             'real_world_fidelity_score':None,
             'human_effects_estimated':False,
             'manager_effects_executed':False,
             'socsci210_study_validation':'NOT_PERFORMED_RIGHTS_HOLD',
             'simulation_artifacts':sorted(present),
          }
          (real/'verification.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='simulation_artifacts'},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-concordia-social-agents-offline-mock
          path: products/manager/output/concordia-social/
          if-no-files-found: warn
          retention-days: 14

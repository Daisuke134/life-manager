name: Manager Concordia Social Agents Offline Sandbox (MOCK, not human validation)
on:
  push:
    branches: [research/manager-product-r006-20261020]
    paths: ['.github/workflows/manager-concordia-social-sandbox.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  social-agent-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout immutable official Concordia source
        run: |
          git init /tmp/concordia-social-upstream
          git -C /tmp/concordia-social-upstream remote add origin https://github.com/google-deepmind/concordia.git
          git -C /tmp/concordia-social-upstream fetch --depth 1 origin 7128586aa8c1073bfa09dcb3781cea21e1a49229
          git -C /tmp/concordia-social-upstream checkout --detach FETCH_HEAD
          test "$(git -C /tmp/concordia-social-upstream rev-parse HEAD)" = 7128586aa8c1073bfa09dcb3781cea21e1a49229
      - name: Install bounded research-only dependencies (no model API key)
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2" "scipy==1.15.3" /tmp/concordia-social-upstream
      - name: Run actual Concordia social engine using only constructed agents
        run: |
          python products/manager/scripts/concordia_island_mock.py \
            --upstream-root=/tmp/concordia-social-upstream \
            --output="$GITHUB_WORKSPACE/products/manager/output/concordia-social"
      - name: Enforce independent human-validation absence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('products/manager/output/concordia-social')
          s=json.loads((root/'simulation/simulation_summary.json').read_text())
          v=json.loads((root/'real_world_validation/verification.json').read_text())
          assert s['uses_esa_agent_prefab'] and s['emitted_engine_events'] > 0
          assert s['simulated_agents']==2 and s['raw_personal_records']==0
          assert (root/'simulation/simulated_agent_log.html').stat().st_size > 50
          assert v['real_world_validation_records']==0
          assert v['human_behavior_fidelity_score'] is None
          assert v['manager_world_effect']=='NONE'
          print('PASS: real Concordia engine executed, real-world evidence distinct and absent')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-concordia-social-agents-offline-mock
          path: products/manager/output/concordia-social/
          if-no-files-found: warn
          retention-days: 14

name: Manager HeartSteps Pinned Research
on:
  push:
    branches: [research/manager-product-r006-20261020]
    paths:
      - 'products/manager/scripts/heartsteps_research.py'
      - 'products/manager/scripts/heartsteps_phase3.py'
      - 'products/manager/scripts/heartsteps_phase3_exploratory.py'
      - 'products/manager/scripts/heartsteps_phase3_public.py'
      - 'products/manager/scripts/heartsteps_phase3_probe.py'
      - 'products/manager/scripts/heartsteps_phase3_cutoff_probe.py'
      - 'products/manager/scripts/heartsteps_phase3_day_join_probe.py'
      - 'products/manager/scripts/heartsteps_phase3_day_join_probe.py'
      - 'products/manager/tests/test_heartsteps_research_h002_h004.py'
      - 'products/manager/tests/test_heartsteps_phase3.py'
      - 'products/manager/tests/test_heartsteps_exploratory.py'
      - 'products/manager/tests/test_heartsteps_phase3_public.py'
      - 'products/manager/tests/test_heartsteps_phase3_probe.py'
      - 'products/manager/tests/test_heartsteps_phase3_cutoff_probe.py'
      - 'products/manager/tests/test_heartsteps_day_join_probe.py'
      - 'products/manager/tests/test_heartsteps_day_join_probe.py'
      - '.github/workflows/manager-heartsteps-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aggregate-source-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused source tests
        run: python -m unittest tests/test_heartsteps_research_h002_h004.py -v
      - name: Focused reproduction and exploratory tests
        run: python -m unittest tests/test_heartsteps_phase3.py tests/test_heartsteps_phase3_public.py tests/test_heartsteps_phase3_probe.py tests/test_heartsteps_phase3_cutoff_probe.py tests/test_heartsteps_day_join_probe.py tests/test_heartsteps_exploratory.py -v
      - name: Download pinned source temporarily and emit aggregate source report
        run: python scripts/heartsteps_research.py --output output/heartsteps
      - name: Emit aggregate mapping diagnostics
        run: python scripts/heartsteps_phase3_probe.py --output output/heartsteps-probe
      - name: Scan decision-index boundaries without participant output
        run: python scripts/heartsteps_phase3_cutoff_probe.py --output output/heartsteps-cutoff
      - name: Probe public step-day join coverage (aggregate only)
        run: python scripts/heartsteps_phase3_day_join_probe.py --output output/heartsteps-day-join
      - name: Compare study-day from public step series against decisions (aggregate-only)
        run: python scripts/heartsteps_phase3_day_join_probe.py --output output/heartsteps-day-join
      - name: Exploratory public dataset analysis (NOT the 2019 RCT replication)
        run: python scripts/heartsteps_phase3_exploratory.py --output output/heartsteps-public-exploratory
      - name: Verify no raw CSV persisted in repository workspace
        if: always()
        run: |
          test ! -e data/raw/suggestions.csv
          ! find output -type f -name '*.csv' | grep .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heartsteps-phase3-summary
          path: |
            products/manager/output/heartsteps
            products/manager/output/heartsteps-probe
            products/manager/output/heartsteps-cutoff
            products/manager/output/heartsteps-day-join
            products/manager/output/heartsteps-day-join
            products/manager/output/heartsteps-public-exploratory
          if-no-files-found: warn
          retention-days: 14

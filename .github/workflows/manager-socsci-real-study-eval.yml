name: Manager Real SocSci210 Held-out Aggregate Research
on:
  push:
    branches: [research/manager-product-r006-20261020]
    paths:
      - 'products/manager/manager_core/phase04_socsci_empirical.py'
      - 'products/manager/scripts/phase04_socsci_empirical.py'
      - 'products/manager/tests/test_phase04_socsci_empirical.py'
      - '.github/workflows/manager-socsci-real-study-eval.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-heldout-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: products/manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install bounded SQL engine
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1
      - name: Research-method tests on synthetic constructed observations
        run: python -m unittest tests/test_phase04_socsci_empirical.py -v
      - name: Real source — immutable 170 seen / 40 unseen without saving personal records
        run: python scripts/phase04_socsci_empirical.py --output output/socsci-real-eval/aggregate.json
      - name: Enforce evidence boundaries and source-shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output=Path('output/socsci-real-eval')
          assert {x.name for x in output.iterdir()}=={'aggregate.json'}
          r=json.loads((output/'aggregate.json').read_text())
          assert r['source_split']['seen_studies']==170
          assert r['source_split']['unseen_studies']==40
          assert r['source_split']['overlap']==0
          assert r['source_split']['seen_rows']>0
          assert r['source_split']['unseen_rows']>0
          assert r['privacy']['participant_records_published']==0
          assert r['privacy']['raw_rows_saved'] is False
          assert r['scientific_gates']['S005_pretrained_model_same_split']=='NOT_RUN'
          assert r['scientific_gates']['causal_effect_prediction']=='NOT_TESTED'
          assert not list(output.glob('*.csv')) and not list(output.glob('*.parquet'))
          print('PASS: 40 unseen real studies evaluated, outcome semantics limitation retained')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: manager-socsci210-real-heldout-aggregate-metrics
          path: products/manager/output/socsci-real-eval/aggregate.json
          if-no-files-found: error
          retention-days: 14

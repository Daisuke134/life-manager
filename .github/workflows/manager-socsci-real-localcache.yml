name: Manager SocSci210 Local-Cache Real Holdout (17 pinned shards)
on:
  push:
    branches: [research/manager-product-r006-20261020]
    paths:
      - 'products/manager/scripts/phase04_socsci_empirical.py'
      - 'products/manager/manager_core/phase04_socsci_empirical.py'
      - 'products/manager/tests/test_phase04_socsci_empirical.py'
      - '.github/workflows/manager-socsci-real-localcache.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  full-source-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    defaults:
      run:
        working-directory: products/manager
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Pinned research dependencies
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1 huggingface_hub==0.36.0
      - name: Baseline evaluation correctness tests
        run: python -m unittest tests/test_phase04_socsci_empirical.py -v
      - name: Real 17-shard corpus ephemeral, aggregate-only readout
        run: python scripts/phase04_socsci_empirical.py --transport local --output output/socsci210-full/aggregate.json
      - name: Confirm entire 170/40 split and no source rows in artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('output/socsci210-full')
          assert {p.name for p in root.iterdir()}=={'aggregate.json'}
          a=json.loads((root/'aggregate.json').read_text())
          assert a['source_split']['seen_studies']==170
          assert a['source_split']['unseen_studies']==40
          assert a['evidence']['parquet_files']==17
          assert a['privacy']['raw_rows_saved'] is False
          assert a['privacy']['participant_records_published']==0
          print('PASS 17 pinned parquet shards and complete 40-study heldout.')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: manager-socsci210-full-real-holdout-aggregate-only
          path: products/manager/output/socsci210-full/aggregate.json
          if-no-files-found: error
          retention-days: 14

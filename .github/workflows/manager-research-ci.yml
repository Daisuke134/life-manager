name: Manager Independent Offline Research
on:
  push:
    branches: [research/manager-product-r006-20261020, research/manager-phase05-kernel-20261021, research/manager-phase06-evidence-r001-20261021, research/manager-phase06-f002-f003-20261021, research/manager-crossfield-evidence-20261021, research/manager-phase06-unblock-evidence-20261021, research/manager-reuse-only-world-evals-20261021, research/manager-phase06-internet-public-good-20261021]
    paths:
      - 'products/manager/**'
      - '.github/workflows/manager-research-ci.yml'
  workflow_dispatch:
jobs:
  manager-offline-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preregistration bytes and SHA256
        run: sha256sum pilot/PREREGISTRATION.json
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Phase04 deterministic methods demo (SYNTHETIC, NOT an empirical benchmark)
        run: python scripts/phase04_synthetic_bench.py --output output/phase04-synthetic
      - name: Verify aggregate-only and separate causal evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('output/phase04-synthetic')
          p=json.loads((root/'prediction_and_shift.json').read_text())
          c=json.loads((root/'causal_fidelity_counterexample.json').read_text())
          v=json.loads((root/'verification_boundary.json').read_text())
          assert p['basis']=='SYNTHETIC_ONLY' and p['real_study_evaluated'] is False
          assert p['test_studies_disjoint']
          assert c['real_world_causal_validation'] is False
          assert v['real_beneficiaries']==0
          assert not list(root.glob('*.csv'))
          PY
      - name: Compile editable research-seminar source
        run: python -m py_compile scripts/build_behavior_agi_lab_seminar_v3.py
      - name: Product boundary
        run: python scripts/check_boundaries.py
      - name: Phase05 offline two-domain reproducible demonstration
        run: python scripts/phase05_demo.py --check
      - name: Phase06 third-party historical public finance readback (not impact)
        run: python scripts/phase06_public_finance_readback.py --collective webpack
      - name: Phase06 public opt-in indoor air real readback (NO intervention)
        run: python scripts/phase06_public_indoor_readback.py
      - name: Phase06 issuer and site blocker gap report (not authorized)
        run: python scripts/check_phase06_authority.py
      - name: Reuse official GrowthBook Python SDK (synthetic only)
        run: |
          python -m pip install --disable-pip-version-check -r requirements-internet-eval.txt
          python scripts/phase06_growthbook_existing_sdk.py
      - name: Independently verify actual public GitHub artifact by unauthenticated GET
        run: python scripts/phase06_public_good_readback.py --baseline-sha c16660f9c6d5c1a79a801f0587dc7cc0355df1b3
      - name: Manager offline self-check
        run: python -m manager_core
      - name: Backlog consistency
        run: python scripts/make_roadmap.py --check

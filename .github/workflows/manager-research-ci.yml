name: Manager Independent Offline Research
on:
  push:
    branches: [research/manager-product-r006-20261020]
    paths:
      - 'products/manager/**'
      - '.github/workflows/manager-research-ci.yml'
  workflow_dispatch:
jobs:
  manager-offline-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Product boundary
        run: python scripts/check_boundaries.py
      - name: Backlog consistency
        run: python scripts/make_roadmap.py --check

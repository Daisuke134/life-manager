name: Anicca iOS build

on:
  workflow_dispatch:
    inputs:
      run_maestro:
        description: Run the real soft-paywall journey and capture simulator video
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/anicca-ios/**'
      - '.github/workflows/anicca-ios-build.yml'
  push:
    branches: [muse/hard-paywall-1.9.9]
    paths:
      - 'apps/mobile/anicca-ios/**'
      - '.github/workflows/anicca-ios-build.yml'

permissions:
  contents: read

jobs:
  maestro:
    name: Real soft-paywall Maestro and video
    if: github.event_name == 'workflow_dispatch' && inputs.run_maestro
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/mobile/anicca-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the free Maestro CLI
        run: brew install mobile-dev-inc/tap/maestro
      - name: Inject private real SDK configuration
        env:
          ANICCA_PRODUCTION_XCCONFIG_B64: ${{ secrets.ANICCA_E2E_XCCONFIG_B64 }}
        run: |
          bash ci_scripts/ci_post_clone.sh
          cp Configs/Production.xcconfig Configs/Staging.xcconfig
      - name: Build, run the actual journey, and record
        run: bash scripts/run-soft-paywall-maestro.sh "$RUNNER_TEMP/soft-paywall-evidence"
      - name: Preserve real run evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-paywall-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/soft-paywall-evidence
          if-no-files-found: warn
  build:
    name: Build and unit tests (unsigned)
    if: github.event_name != 'workflow_dispatch' || !inputs.run_maestro
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile/anicca-ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate xcconfig files from examples
        # Real values are injected by Xcode Cloud (ci_post_clone.sh) for
        # release builds. CI only needs the files to exist to type-check
        # and build; the examples contain placeholders only.
        run: |
          cp Configs/Production.xcconfig.example Configs/Production.xcconfig
          cp Configs/Staging.xcconfig.example Configs/Staging.xcconfig

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project aniccaios.xcodeproj -scheme aniccaios

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          set +e
          xcodebuild build \
            -project aniccaios.xcodeproj \
            -scheme aniccaios \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/build-output.log" 2>&1
          BUILD_EXIT=$?
          set -e
          echo "----- compiler errors -----"
          grep -E "error:|fatal error:|\*\* BUILD (FAILED|SUCCEEDED)" "$RUNNER_TEMP/build-output.log" | head -80 || true
          echo "----- build summary -----"
          tail -40 "$RUNNER_TEMP/build-output.log"
          exit "$BUILD_EXIT"

      - name: Run unit tests (unsigned)
        # The macos-15 image (Xcode 16.4) ships no pre-created "iPhone 15"
        # simulator; pick the first available iPhone simulator instead of
        # hard-coding a device name.
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep 'iPhone' | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          echo "Running tests on simulator: $UDID"
          set +e
          # Unit tests only. The aniccaiosUITests (PaywallE2ETests) drive the
          # real app end-to-end and require live RevenueCat keys: with the
          # placeholder xcconfigs generated above, RevenueCat returns
          # "Invalid API Key", offerings never load and the paywall is
          # unreachable by design. Those tests belong to the Xcode Cloud
          # lane, where ci_post_clone.sh injects the real configuration.
          xcodebuild test \
            -project aniccaios.xcodeproj \
            -scheme aniccaios \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:aniccaiosTests \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/test-output.log" 2>&1
          TEST_EXIT=$?
          set -e
          echo "----- failing tests / errors -----"
          grep -E "Test Case .* failed|error:|\*\* TEST (FAILED|SUCCEEDED)" "$RUNNER_TEMP/test-output.log" | head -80 || true
          echo "----- test summary -----"
          grep -E "Executed [0-9]+ test|Test Suite .* (passed|failed)" "$RUNNER_TEMP/test-output.log" | tail -20 || true
          tail -20 "$RUNNER_TEMP/test-output.log"
          exit $TEST_EXIT

      - name: Preserve full build and unit test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-and-unit-test-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-output.log
            ${{ runner.temp }}/test-output.log
          if-no-files-found: warn

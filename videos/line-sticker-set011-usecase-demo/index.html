<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: #faf5ef;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root > [data-composition-src] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1080"
      data-height="1920"
      data-duration="9"
    >
      <div
        id="el-line-sticker-set011-demo"
        class="clip"
        data-composition-id="line-sticker-set011-demo"
        data-composition-src="compositions/index.html"
        data-start="0"
        data-duration="9"
        data-track-index="0"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const rootTimeline = gsap.timeline({ paused: true });
      window.__timelines["main"] = rootTimeline;
      rootTimeline.seek(0);
    </script>
  </body>
</html>

        #line-sticker-set011-demo-root,
        #line-sticker-set011-demo-root * {
          box-sizing: border-box;
        }

        #line-sticker-set011-demo-root {
          --palette-bg: #faf5ef;
          --palette-paper: #fffcfa;
          --palette-ink: #3d3537;
          --palette-accent: #676389;
          --palette-accent-soft: rgba(103, 99, 137, 0.14);
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          isolation: isolate;
          background:
            radial-gradient(ellipse 68% 45% at 52% 52%, var(--palette-accent-soft), transparent 72%),
            var(--palette-bg);
          color: var(--palette-ink);
          font-family: "Noto Sans JP", sans-serif;
          font-synthesis: none;
          -webkit-font-smoothing: antialiased;
          text-rendering: geometricPrecision;
        }

        #line-sticker-set011-demo-root .scene.clip {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }

        #line-sticker-set011-demo-root .scene-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 32px;
          width: 100%;
          height: 100%;
          padding: 120px 88px;
        }

        #line-sticker-set011-demo-root .message-bubble {
          position: relative;
          isolation: isolate;
          display: flex;
          flex: 0 0 380px;
          align-items: center;
          justify-content: center;
          width: min(900px, 100%);
          height: 380px;
          padding: 48px 66px;
          border: 3px solid var(--palette-accent);
          border-radius: 54px;
          background: var(--palette-paper);
          box-shadow: 0 22px 54px rgba(61, 53, 55, 0.11);
          text-align: center;
        }

        #line-sticker-set011-demo-root .message-bubble::after {
          position: absolute;
          z-index: 0;
          right: 156px;
          bottom: -24px;
          width: 48px;
          height: 48px;
          border-right: 3px solid var(--palette-accent);
          border-bottom: 3px solid var(--palette-accent);
          border-bottom-right-radius: 12px;
          background: var(--palette-paper);
          content: "";
          transform: rotate(45deg);
        }

        #line-sticker-set011-demo-root .bubble-copy {
          position: relative;
          z-index: 1;
          max-width: 760px;
          margin: 0;
          color: var(--palette-ink);
          font-size: 68px;
          font-weight: 700;
          line-height: 1.4;
          letter-spacing: 0.015em;
          text-wrap: balance;
        }

        #line-sticker-set011-demo-root .message-lines {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        }

        #line-sticker-set011-demo-root .message-line {
          display: block;
          white-space: nowrap;
        }

        #line-sticker-set011-demo-root .accent-word {
          color: var(--palette-accent);
        }

        #line-sticker-set011-demo-root .sticker-slot {
          position: relative;
          flex: 0 0 540px;
          width: 700px;
          height: 540px;
        }

        #line-sticker-set011-demo-root .sticker-art {
          position: relative;
          width: 100%;
          height: 100%;
        }

        #line-sticker-set011-demo-root .sticker-frame.clip {
          position: absolute;
          inset: 0;
          width: 640px;
          height: 540px;
          margin: auto;
          object-fit: contain;
          object-position: center;
          background: transparent;
        }

        #line-sticker-set011-demo-root .closing-content {
          display: flex;
          flex: 0 0 680px;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 42px;
          width: min(900px, 100%);
          height: 680px;
          padding: 70px 64px;
        }

        #line-sticker-set011-demo-root .closing-title {
          max-width: 760px;
          margin: 0;
          color: var(--palette-ink);
          font-size: 64px;
          font-weight: 700;
          line-height: 1.38;
          letter-spacing: 0.01em;
          text-align: center;
          text-wrap: balance;
        }

        #line-sticker-set011-demo-root .closing-cta {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-height: 92px;
          max-width: 100%;
          padding: 22px 38px;
          border-radius: 999px;
          background: var(--palette-ink);
          color: var(--palette-paper);
          font-size: 36px;
          font-weight: 700;
          line-height: 1.35;
          letter-spacing: 0.01em;
          text-align: center;
          white-space: nowrap;
        }

        @media (max-width: 1080px) {
          #line-sticker-set011-demo-root .scene-content {
            padding-right: 7vw;
            padding-left: 7vw;
          }

          #line-sticker-set011-demo-root .message-bubble {
            padding-right: 6vw;
            padding-left: 6vw;
          }
        }
      </style>
